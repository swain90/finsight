apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finsight.fullname" . }}-api
  labels:
    {{- include "finsight.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "finsight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finsight.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ include "finsight.fullname" . }}-db-secret
                  key: connection-string
            - name: ConnectionStrings__Redis
              value: "{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "finsight.fullname" . }}-secrets
                  key: jwt-secret-key
            - name: OpenAI__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "finsight.fullname" . }}-secrets
                  key: openai-api-key
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
