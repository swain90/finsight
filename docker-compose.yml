services:
  # ─── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=finsight;Username=postgres;Password=postgres_dev_password
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-dev-secret-key-change-in-production-min-64-chars-long}
      - JwtSettings__Issuer=finsight-api
      - JwtSettings__Audience=finsight-client
      - JwtSettings__ExpiryMinutes=30
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - Plaid__ClientId=${PLAID_CLIENT_ID:-}
      - Plaid__Secret=${PLAID_SECRET:-}
      - Plaid__BaseUrl=https://sandbox.plaid.com
      - Seq__ServerUrl=http://seq:5341
      - AllowedOrigins__0=http://localhost:3000
      - AllowedOrigins__1=http://frontend:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finsight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsight-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finsight-network
    restart: unless-stopped

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: finsight-postgres
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsight-network

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - finsight-network

  # ─── Seq (Structured Logs) ─────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: finsight-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data
    networks:
      - finsight-network

volumes:
  postgres_data:
  redis_data:
  seq_data:

networks:
  finsight-network:
    driver: bridge
