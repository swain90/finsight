apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-api
  namespace: finsight
  labels:
    app: finsight-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsight-api
  template:
    metadata:
      labels:
        app: finsight-api
    spec:
      serviceAccountName: finsight-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: api
          image: ghcr.io/your-org/finsight-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: db-connection-string
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: redis-connection-string
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: jwt-secret-key
            - name: OpenAI__ApiKey
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: openai-api-key
                  optional: true
            - name: Plaid__ClientId
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: plaid-client-id
                  optional: true
            - name: Plaid__Secret
              valueFrom:
                secretKeyRef:
                  name: finsight-secrets
                  key: plaid-secret
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
