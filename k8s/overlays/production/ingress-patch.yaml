apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finsight-api
  namespace: finsight
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "200"
    # cert-manager issues the TLS cert automatically
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.finsight.dev
      secretName: finsight-tls-prod
  rules:
    - host: api.finsight.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finsight-api
                port:
                  number: 80
