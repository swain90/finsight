apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finsight-api
  namespace: finsight
spec:
  tls:
    - hosts:
        - api.dev.finsight.local
      secretName: finsight-dev-tls
  rules:
    - host: api.dev.finsight.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finsight-api
                port:
                  number: 80
